name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: バージョン文字列を自動更新
        run: |
          BUILD_DATE=$(TZ='Asia/Tokyo' date '+%Y%m%d')
          LABEL_DATE=$(TZ='Asia/Tokyo' date '+%Y.%m.%d')
          OLD_BUILD=$(grep -oP "(?<=VT_APP_BUILD = ')[^']*" js/app.js)
          OLD_BUILD_DATE="${OLD_BUILD%-*}"
          OLD_SEQ="${OLD_BUILD##*-}"
          if [ "$OLD_BUILD_DATE" = "$BUILD_DATE" ]; then
            NEW_SEQ=$((OLD_SEQ + 1))
          else
            NEW_SEQ=1
          fi
          NEW_BUILD="${BUILD_DATE}-${NEW_SEQ}"
          NEW_LABEL="${LABEL_DATE}.${NEW_SEQ}"

          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${NEW_LABEL}'/" js/app.js
          sed -i "s/window.VT_APP_BUILD = '[^']*'/window.VT_APP_BUILD = '${NEW_BUILD}'/" js/app.js
          sed -i "s/window.VT_APP_VERSION_LABEL = '[^']*'/window.VT_APP_VERSION_LABEL = '${NEW_LABEL}'/" js/app.js
          sed -i "s/${OLD_BUILD}/${NEW_BUILD}/g" sw.js
          sed -i "s/${OLD_BUILD}/${NEW_BUILD}/g" index.html

          echo "Build: $OLD_BUILD -> $NEW_BUILD (label: $NEW_LABEL)"

      - name: GitHub Pages用にセットアップ
        uses: actions/configure-pages@v5

      - name: ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
